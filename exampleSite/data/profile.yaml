name: Evander Grimveil

# Optional line under the name: "position, affiliation". Markdown is allowed.
position: PhD Candidate in Arcane Studies
affiliation: Institute for Occult Sciences and Mysticism

# Path in assets/ (resized automatically), in static/, or a full URL.
