# Markdown. Separate paragraphs with a blank line.
bio: >-
  Evander Grimveil is a PhD candidate in the Department of Arcane Studies at the
  Institute for Occult Sciences and Mysticism, specializing in advanced curse
  mechanics, forbidden rituals and interdimensional entities. His research asks
  where the ethical boundaries of high-level hexes lie, and how dark arts can be
  practised responsibly. Evander holds a Master of Dark Arts and Esoteric
  Knowledge from Sorcerum University and has been recognized for his
  containment protocols for cursed objects.

